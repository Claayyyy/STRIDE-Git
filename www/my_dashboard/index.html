<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>InsightEd PWA</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="images/In-Site.png">
    <meta name="theme-color" content="#0038A8">

    <!-- React Dependencies -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>

    <style>
        /* --- GLOBAL & LAYOUT --- */
        html, body { height: 100%; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; background-color: #f3f4f6; overflow-x: hidden; }
        .background-shapes { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #0038A8 0%, #002163 100%); z-index: 1; pointer-events: none; }
        .shape { position: absolute; border-radius: 50%; opacity: 0.6; filter: blur(40px); }
        .shape-1 { width: 300px; height: 300px; background: #0056b3; top: -50px; left: -50px; }
        .shape-2 { width: 400px; height: 400px; background: #FDB913; bottom: -100px; right: -100px; opacity: 0.2; }
        
        /* --- LOADING --- */
        .loading-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; z-index: 9999; background: #f3f4f6; }
        .spinner { border: 5px solid rgba(0, 56, 168, 0.3); border-top: 5px solid #0038A8; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* --- AUTH CARDS --- */
        .auth-wrapper { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; display: flex; justify-content: center; align-items: center; z-index: 2000; overflow-y: auto; padding: 20px 0; }
        .auth-card { background: rgba(255,255,255,0.98); padding: 30px; width: 90%; max-width: 500px; border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); max-height: 90vh; overflow-y: auto; margin: auto; }
        
        /* --- FORM STYLES --- */
        .form-section-title { color: #0038A8; border-bottom: 2px solid #FDB913; padding-bottom: 5px; margin-top: 25px; margin-bottom: 15px; font-weight: bold; font-size: 1.1rem; }
        .form-control { width: 100%; padding: 12px; margin-bottom: 12px; background: #f3f4f6; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        .form-row { display: flex; gap: 10px; flex-wrap: wrap; }
        .form-col { flex: 1; min-width: 120px; }
        label { font-size: 12px; font-weight: bold; color: #555; margin-bottom: 4px; display: block; }
        
        .btn { width: 100%; padding: 14px; border-radius: 12px; font-weight: bold; cursor: pointer; border: none; margin-top: 10px; transition: 0.2s; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-primary { background: #0038A8; color: white; }
        .btn-secondary { background: transparent; color: #0038A8; border: 2px solid #FDB913; }
        .btn-google { background: white; color: #555; border: 1px solid #ddd; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .text-error { color: red; text-align: center; display: block; margin-bottom: 10px; font-size: 0.9em; }

        /* --- APP UI --- */
        .app-layout { height: 100vh; display: flex; flex-direction: column; position: relative; z-index: 10; background: #fff; }
        .app-header { padding: 15px; border-bottom: 1px solid #eee; text-align: center; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .content-area { flex-grow: 1; padding: 20px; overflow-y: auto; max-width: 800px; margin: 0 auto; width: 100%; box-sizing: border-box; }
        .footer-nav { padding: 15px; border-top: 1px solid #eee; display: flex; gap: 10px; background: white; }
        .step-indicator { display: flex; justify-content: center; gap: 5px; margin-top: 10px; }
        .step { width: 25px; height: 25px; border-radius: 50%; background: #eee; color: #555; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; }
        .step.active { background: #2a8c4a; color: white; }
        h4 { color: #0038A8; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-top: 0; }
    </style>
</head>
<body>

    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
    </div>

    <div id="root"></div>

    <script type="text/babel">

        // --- 1. CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyCYRVZtXlGELDM9uo8x63C90ljg-xmWQ5o",
            authDomain: "insighted-b07d2.firebaseapp.com",
            projectId: "insighted-b07d2",
            storageBucket: "insighted-b07d2.firebasestorage.app",
            messagingSenderId: "812117773472",
            appId: "1:812117773472:web:69a6ee212bf73cabe44dc5"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const googleProvider = new firebase.auth.GoogleAuthProvider();

        // --- 2. DB UTILS ---
        const DB_NAME = 'surveyDB';
        const saveToDB = (data) => {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME, 1);
                req.onupgradeneeded = e => e.target.result.createObjectStore('surveys', { keyPath: 'id', autoIncrement: true });
                req.onsuccess = e => {
                    const tx = e.target.result.transaction(['surveys'], 'readwrite');
                    tx.objectStore('surveys').add(data);
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => reject(tx.error);
                };
            });
        };

        // --- 3. COMPONENTS ---

        const LoadingScreen = () => <div className="loading-container"><div className="spinner"></div></div>;

        const LoginCard = ({ onSwitch }) => {
            const [email, setEmail] = React.useState('');
            const [pass, setPass] = React.useState('');
            const [error, setError] = React.useState('');
            const [loading, setLoading] = React.useState(false);

            const handleLogin = async (e) => {
                e.preventDefault(); setLoading(true); setError('');
                try { await auth.signInWithEmailAndPassword(email, pass); } 
                catch(err) { setError(err.message); setLoading(false); }
            };
            const handleGoogle = async () => {
                try {
                    const res = await auth.signInWithPopup(googleProvider);
                    if (!res.user.email.endsWith('@deped.gov.ph')) {
                        await res.user.delete(); await auth.signOut(); setError("Restricted: Use @deped.gov.ph email");
                    }
                } catch(err) { setError(err.message); }
            };

            return (
                <div className="auth-wrapper">
                    <div className="auth-card">
                        <h2 style={{color:'#0038A8', textAlign:'center'}}>Welcome Back</h2>
                        <form onSubmit={handleLogin}>
                            <label>Email</label>
                            <input className="form-control" type="email" value={email} onChange={e=>setEmail(e.target.value)} required />
                            <label>Password</label>
                            <input className="form-control" type="password" value={pass} onChange={e=>setPass(e.target.value)} required />
                            {error && <span className="text-error">{error}</span>}
                            <button className="btn btn-primary" type="submit" disabled={loading}>{loading?'...':'Sign In'}</button>
                        </form>
                        <button className="btn btn-google" onClick={handleGoogle}>Google Login</button>
                        <div style={{textAlign:'center', margin:'15px', color:'#999'}}>OR</div>
                        <button className="btn btn-secondary" onClick={onSwitch}>Create Account</button>
                    </div>
                </div>
            );
        };

        const RegisterCard = ({ onSwitch }) => {
            const [form, setForm] = React.useState({
                officeType: '', division: '', position: '', 
                fname: '', mname: '', lname: '', birthdate: '', age: '',
                addr_region: '', addr_province: '', addr_muni: '',
                email: '', pass: '', confirm: ''
            });
            const [csvData, setCsvData] = React.useState([]);
            const [addrData, setAddrData] = React.useState({});
            const [error, setError] = React.useState('');
            const [loading, setLoading] = React.useState(false);

            React.useEffect(() => {
                // Load Positions
                fetch('positions.csv').then(r=>r.text()).then(t => {
                    const lines = t.trim().split('\n');
                    const headers = lines[0].split(',');
                    const parsed = lines.slice(1).map(l => {
                        const v = l.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(i => i.replace(/^"|"$/g, '').trim());
                        let obj = {}; headers.forEach((h,i) => obj[h] = v[i]); return obj;
                    });
                    setCsvData(parsed);
                }).catch(e => {
                    console.warn("CSV Error:", e);
                    setCsvData([]);
                });

                // Load Addresses
                fetch('https://raw.githubusercontent.com/isaacdarcilla/philippine-addresses/main/region-province-city-barangay-2020.json')
                    .then(r=>r.json()).then(d => setAddrData(d));
            }, []);

            // Auto-Age
            React.useEffect(() => {
                if(form.birthdate) {
                    const age = Math.abs(new Date(Date.now() - new Date(form.birthdate).getTime()).getUTCFullYear() - 1970);
                    setForm(f => ({...f, age}));
                }
            }, [form.birthdate]);

            // Filters
            // 1. Divisions: Since Region is gone, we just show ALL unique divisions from the CSV
            const divisions = React.useMemo(() => {
                return [...new Set(csvData.map(i => i['Division']))].sort();
            }, [csvData]);
            
            // 2. Positions: Show ALL unique positions, regardless of office or division selection
            const positions = React.useMemo(() => {
                return [...new Set(csvData.map(i => i['Position']))].sort();
            }, [csvData]);

            // Address Dropdowns
            const addrRegs = Object.keys(addrData).map(k=>({code:k, name:addrData[k].region_name}));
            const addrProvinces = (form.addr_region && addrData[form.addr_region]) ? Object.keys(addrData[form.addr_region].province_list) : [];
            const addrMunis = (form.addr_region && form.addr_province) ? 
                (Array.isArray(addrData[form.addr_region].province_list[form.addr_province].municipality_list) 
                ? addrData[form.addr_region].province_list[form.addr_province].municipality_list 
                : Object.keys(addrData[form.addr_region].province_list[form.addr_province].municipality_list)) : [];

            const handleChange = e => setForm({...form, [e.target.name]: e.target.value});

            const handleReg = async (e) => {
                e.preventDefault();
                if(form.pass !== form.confirm) return setError("Passwords mismatch");
                if(form.pass.length < 6) return setError("Password too short");
                setLoading(true); setError('');
                try {
                    const cred = await auth.createUserWithEmailAndPassword(form.email, form.pass);
                    await cred.user.updateProfile({ displayName: `${form.fname} ${form.lname}` });
                    alert("Account Created!");
                } catch(err) { setError(err.message); setLoading(false); }
            };

            return (
                <div className="auth-wrapper">
                    <div className="auth-card">
                        <h2 style={{color:'#0038A8', textAlign:'center'}}>Create Account</h2>
                        <form onSubmit={handleReg}>
                            
                            <div className="form-section-title">1. Office & Position</div>
                            <label>Office Type</label>
                            <select className="form-control" name="officeType" value={form.officeType} onChange={handleChange} required>
                                <option value="">Select...</option>
                                <option value="Central Office">Central Office</option>
                                <option value="Regional Office">Regional Office</option>
                                <option value="School Division Office">SDO</option>
                                <option value="School">School</option>
                            </select>

                            {/* Removed Region Dropdown */}

                            {(form.officeType === 'School Division Office' || form.officeType === 'School') && (
                                <div>
                                    <label>Division</label>
                                    <select className="form-control" name="division" value={form.division} onChange={handleChange} required>
                                        <option value="">Select Division...</option>
                                        {divisions.map(d=><option key={d} value={d}>{d}</option>)}
                                    </select>
                                </div>
                            )}

                            {form.officeType === 'School' && (
                                <div className="form-row">
                                    <div className="form-col"><label>School ID</label><input className="form-control" name="schoolID" required /></div>
                                    <div className="form-col" style={{flex:2}}><label>School Name</label><input className="form-control" name="schoolName" required /></div>
                                </div>
                            )}

                            <label>Position (All Positions)</label>
                            <select className="form-control" name="position" value={form.position} onChange={handleChange} required>
                                <option value="">Select Position...</option>
                                {positions.map(p=><option key={p} value={p}>{p}</option>)}
                            </select>

                            <div className="form-section-title">2. Personal Info</div>
                            <div className="form-row">
                                <div className="form-col"><label>First Name</label><input className="form-control" name="fname" value={form.fname} onChange={handleChange} required /></div>
                                <div className="form-col" style={{flex:0.5}}><label>M.I.</label><input className="form-control" name="mname" value={form.mname} onChange={handleChange} /></div>
                            </div>
                            <label>Last Name</label><input className="form-control" name="lname" value={form.lname} onChange={handleChange} required />
                            <div className="form-row">
                                <div className="form-col"><label>Birthdate</label><input className="form-control" type="date" name="birthdate" value={form.birthdate} onChange={handleChange} required /></div>
                                <div className="form-col"><label>Age</label><input className="form-control" value={form.age} readOnly style={{background:'#eee'}} /></div>
                            </div>

                            <div className="form-section-title">3. Address</div>
                            <label>Region</label>
                            <select className="form-control" name="addr_region" value={form.addr_region} onChange={handleChange} required>
                                <option value="">Select Region...</option>
                                {addrRegs.map(r=><option key={r.code} value={r.code}>{r.name}</option>)}
                            </select>
                            <div className="form-row">
                                <div className="form-col"><label>Province</label>
                                    <select className="form-control" name="addr_province" value={form.addr_province} onChange={handleChange} required>
                                        <option value="">Select...</option>
                                        {addrProvinces.map(p=><option key={p} value={p}>{p}</option>)}
                                    </select>
                                </div>
                                <div className="form-col"><label>Municipality</label>
                                    <select className="form-control" name="addr_muni" value={form.addr_muni} onChange={handleChange} required>
                                        <option value="">Select...</option>
                                        {addrMunis.map(m=><option key={m} value={m}>{m}</option>)}
                                    </select>
                                </div>
                            </div>

                            <div className="form-section-title">4. Credentials</div>
                            <label>DepEd Email</label><input className="form-control" type="email" name="email" value={form.email} onChange={handleChange} required />
                            <label>Password</label><input className="form-control" type="password" name="pass" value={form.pass} onChange={handleChange} required />
                            <label>Confirm</label><input className="form-control" type="password" name="confirm" value={form.confirm} onChange={handleChange} required />

                            {error && <span className="text-error">{error}</span>}
                            <button className="btn btn-primary" style={{backgroundColor:'#FDB913', color:'#0038A8'}} disabled={loading}>{loading?'...':'Sign Up'}</button>
                        </form>
                        <button className="btn btn-secondary" style={{marginTop:'10px', border:'none'}} onClick={onSwitch}>Back to Login</button>
                    </div>
                </div>
            );
        };

        const SurveyApp = ({ user, onLogout }) => {
            const [step, setStep] = React.useState(0);
            const [data, setData] = React.useState({});
            
            const handleChange = e => setData({...data, [e.target.name]: e.target.value});
            const handleSubmit = async () => {
                if(!confirm("Submit Data?")) return;
                try {
                    await saveToDB({...data, uploader: user.email, timestamp: new Date().toISOString()});
                    alert("Saved Offline!");
                    setData({}); setStep(0);
                } catch(e) { alert("Error: "+e.message); }
            };

            const renderStep = () => {
                switch(step) {
                    case 0: return (
                        <div>
                            <h4>School Profile</h4>
                            <label>School ID</label><input className="form-control" name="school_id" value={data.school_id||''} onChange={handleChange} />
                            <label>School Name</label><input className="form-control" name="school_name" value={data.school_name||''} onChange={handleChange} />
                            <label>Region</label><select className="form-control" name="region" value={data.region||''} onChange={handleChange}><option>Select</option><option>Region I</option><option>NCR</option></select>
                            <label>Division</label><input className="form-control" name="division" value={data.division||''} onChange={handleChange} />
                            <label>Curricular Offering</label><select className="form-control" name="offering" value={data.offering||''} onChange={handleChange}><option>Purely ES</option><option>Purely JHS</option></select>
                        </div>
                    );
                    case 1: return (
                        <div>
                            <h4>School Head Info</h4>
                            <div className="form-row">
                                <div className="form-col"><label>Given Name</label><input className="form-control" name="head_gn" value={data.head_gn||''} onChange={handleChange} /></div>
                                <div className="form-col"><label>Last Name</label><input className="form-control" name="head_ln" value={data.head_ln||''} onChange={handleChange} /></div>
                            </div>
                            <label>Position</label><input className="form-control" name="head_pos" value={data.head_pos||''} onChange={handleChange} />
                            <label>Contact No.</label><input className="form-control" type="tel" name="head_tel" value={data.head_tel||''} onChange={handleChange} />
                            <label>Email</label><input className="form-control" type="email" name="head_email" value={data.head_email||''} onChange={handleChange} />
                        </div>
                    );
                    case 2: return (
                        <div>
                            <h4>Enrolment per Grade</h4>
                            <div className="form-row">
                                <div className="form-col"><label>Grade 1</label><input type="number" className="form-control" name="g1" value={data.g1||''} onChange={handleChange} /></div>
                                <div className="form-col"><label>Grade 2</label><input type="number" className="form-control" name="g2" value={data.g2||''} onChange={handleChange} /></div>
                                <div className="form-col"><label>Grade 3</label><input type="number" className="form-control" name="g3" value={data.g3||''} onChange={handleChange} /></div>
                            </div>
                            <div className="form-row">
                                <div className="form-col"><label>Grade 4</label><input type="number" className="form-control" name="g4" value={data.g4||''} onChange={handleChange} /></div>
                                <div className="form-col"><label>Grade 5</label><input type="number" className="form-control" name="g5" value={data.g5||''} onChange={handleChange} /></div>
                                <div className="form-col"><label>Grade 6</label><input type="number" className="form-control" name="g6" value={data.g6||''} onChange={handleChange} /></div>
                            </div>
                        </div>
                    );
                    case 3: return (
                        <div>
                            <h4>Organized Classes</h4>
                            <p>Enter number of classes per grade level</p>
                            <div className="form-row">
                                <div className="form-col"><label>Grade 1</label><input type="number" className="form-control" name="og1" value={data.og1||''} onChange={handleChange} /></div>
                                <div className="form-col"><label>Grade 2</label><input type="number" className="form-control" name="og2" value={data.og2||''} onChange={handleChange} /></div>
                            </div>
                            {/* Add other grades similarly */}
                        </div>
                    );
                    case 4: return (
                        <div>
                            <h4>Teaching Personnel</h4>
                            <label>Total ES Teachers</label><input type="number" className="form-control" name="teach_es" value={data.teach_es||''} onChange={handleChange} />
                            <label>Total JHS Teachers</label><input type="number" className="form-control" name="teach_jhs" value={data.teach_jhs||''} onChange={handleChange} />
                            <label>Total SHS Teachers</label><input type="number" className="form-control" name="teach_shs" value={data.teach_shs||''} onChange={handleChange} />
                        </div>
                    );
                    case 5: return (
                        <div>
                            <h4>Infrastructure</h4>
                            <div className="form-row">
                                <div className="form-col"><label>ES Rooms</label><input type="number" className="form-control" name="infra_es" value={data.infra_es||''} onChange={handleChange} /></div>
                                <div className="form-col"><label>JHS Rooms</label><input type="number" className="form-control" name="infra_jhs" value={data.infra_jhs||''} onChange={handleChange} /></div>
                            </div>
                            <label>Buildings for Repair</label><input type="number" className="form-control" name="infra_repair" value={data.infra_repair||''} onChange={handleChange} />
                        </div>
                    );
                    case 6: return (
                        <div>
                            <h4>Resources</h4>
                            <div className="form-row">
                                <div className="form-col"><label>Laptops</label><input type="number" className="form-control" name="res_laptop" value={data.res_laptop||''} onChange={handleChange} /></div>
                                <div className="form-col"><label>Chairs</label><input type="number" className="form-control" name="res_chairs" value={data.res_chairs||''} onChange={handleChange} /></div>
                            </div>
                            <div className="form-row">
                                <div className="form-col"><label>Printers</label><input type="number" className="form-control" name="res_print" value={data.res_print||''} onChange={handleChange} /></div>
                                <div className="form-col"><label>TVs</label><input type="number" className="form-control" name="res_tv" value={data.res_tv||''} onChange={handleChange} /></div>
                            </div>
                        </div>
                    );
                    case 7: return (
                        <div>
                            <h4>Teacher Specialization</h4>
                            <div className="form-row">
                                <div className="form-col"><label>English</label><input type="number" className="form-control" name="spec_eng" value={data.spec_eng||''} onChange={handleChange} /></div>
                                <div className="form-col"><label>Math</label><input type="number" className="form-control" name="spec_math" value={data.spec_math||''} onChange={handleChange} /></div>
                                <div className="form-col"><label>Science</label><input type="number" className="form-control" name="spec_sci" value={data.spec_sci||''} onChange={handleChange} /></div>
                            </div>
                        </div>
                    );
                    default: return <div>Done</div>;
                }
            };

            return (
                <div className="app-layout">
                    <div className="app-header">
                        <h3>STRIDE Data Entry</h3>
                        <div className="step-indicator">
                            {[0,1,2,3,4,5,6,7].map(i => <div key={i} className={`step ${step===i?'active':''}`}>{i+1}</div>)}
                        </div>
                    </div>
                    <div className="content-area">
                        {renderStep()}
                    </div>
                    <div className="footer-nav">
                        {step > 0 && <button className="btn btn-secondary" onClick={()=>setStep(step-1)}>Back</button>}
                        {step < 7 ? <button className="btn btn-primary" onClick={()=>setStep(step+1)}>Next</button> : <button className="btn btn-primary" onClick={handleSubmit}>Submit</button>}
                        <button className="btn" style={{background:'#aa4a4a', color:'white', width:'auto', padding:'0 20px'}} onClick={onLogout}>Logout</button>
                    </div>
                </div>
            );
        };

        // --- MAIN ---
        const App = () => {
            const [user, setUser] = React.useState(null);
            const [loading, setLoading] = React.useState(true);
            const [view, setView] = React.useState('login');

            React.useEffect(() => auth.onAuthStateChanged(u => { setUser(u); setLoading(false); }), []);

            if (loading) return <LoadingScreen />;
            if (!user) return view === 'login' ? <LoginCard onSwitch={()=>setView('register')} /> : <RegisterCard onSwitch={()=>setView('login')} />;
            return <SurveyApp user={user} onLogout={()=>auth.signOut()} />;
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);

        if ('serviceWorker' in navigator && (window.location.protocol === 'http:' || window.location.protocol === 'https:')) {
            window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(console.error));
        }
    </script>
</body>
</html>
